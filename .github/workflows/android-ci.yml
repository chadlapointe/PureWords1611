name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace > test_log.txt 2>&1 || true

      - name: Commit log
        run: |
          git config user.name "CI Log Bot"
          git config user.email "bot@ci.local"
          git checkout -b ci-logs
          git add test_log.txt
          git commit -m "Add log"
          git push origin ci-logs --force
